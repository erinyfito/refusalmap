[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "erinyfito-refusalmap"
version = "0.1.0"
description = "分析拒答语句，区分是真做不了、是不该做、还是格式没对上"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "erinyfito" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://erinyfito.github.io"
Repository = "https://github.com/erinyfito/refusalmap"
Issues = "https://github.com/erinyfito/refusalmap/issues"

[project.scripts]
refusalmap = "refusalmap:main"

[tool.setuptools]
py-modules = ["refusalmap"]
